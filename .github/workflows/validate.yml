name: Validate Arc Africa
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/smoke.mjs
      - run: node tests/discovery.mjs
